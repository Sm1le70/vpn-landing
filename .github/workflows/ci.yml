name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Минимальная поддерживаемая версия (package.json → engines) и версия из Dockerfile
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-wording

  # Образ собирается и запускается; HEALTHCHECK (/healthz) должен стать healthy
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vpn-landing:ci .
      - name: Контейнер запускается и становится healthy
        run: |
          docker run -d --name app -e SITE_URL=http://localhost:3000 -e APP_SECRET=ci-secret vpn-landing:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || break
            sleep 3
          done
          docker logs app
          exit 1
